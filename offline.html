<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campusly — Offline</title><meta name="theme-color" content="#F4F7FC">
<style>
:root{--bg:#F4F7FC;--card:#fff;--text:#182542;--muted:#74819A;--blue:#356DFF}
@media (prefers-color-scheme:dark){:root{--bg:#0A1430;--card:#101F42;--text:#EAF0FF;--muted:#98A6C6}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.c{max-width:360px}.i{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#14264F,#356DFF)}
h1{font-size:1.4rem;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 20px}
button{min-height:48px;padding:0 24px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 1rem inherit;cursor:pointer}
</style></head>
<body><main class="c"><div class="i"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 9l10 5 10-5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5M22 9v6"/></svg></div>
<h1>You're offline</h1><p>This page isn't saved on your device yet. Connect to the internet and try again. Pages you have already opened still work offline.</p>
<button type="button" onclick="location.reload()">Try again</button></main></body></html>

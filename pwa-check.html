<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campusly: install check</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F4F7FC">
<style>
:root{--bg:#F4F7FC;--card:#fff;--text:#182542;--muted:#74819A;--ok:#16B89A;--err:#E5484D;--warn:#D9830C;--blue:#356DFF;--border:#E1E8F5}
@media (prefers-color-scheme:dark){:root{--bg:#0A1430;--card:#101F42;--text:#EAF0FF;--muted:#98A6C6;--border:#22365F}}
*{box-sizing:border-box}body{margin:0;padding:20px 16px 40px;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto}h1{font-size:1.3rem;margin:0 0 4px}p.s{color:var(--muted);margin:0 0 16px}
.r{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.d{flex:none;width:22px;height:22px;border-radius:50%;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:700;background:var(--muted)}
.ok .d{background:var(--ok)}.bad .d{background:var(--err)}.warn .d{background:var(--warn)}
.r b{display:block}.r small{display:block;color:var(--muted);word-break:break-word}
button{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 1rem inherit;cursor:pointer;margin-top:6px}
button[hidden]{display:none}
</style></head>
<body><main>
<h1>Install check</h1><p class="s">Open this page on the same website and phone where the app will not install.</p>
<div id="out"></div><button id="inst" hidden type="button">Install Campusly now</button>
<script>
(function(){
"use strict";
var out=document.getElementById("out"),btn=document.getElementById("inst"),prompt=null;
var SHELL=["index.html","home.html","auth.html","attendance.html","schedule.html","tasks.html","more.html","offline.html","campusly-firebase.js","pwa.js","sw.js","manifest.webmanifest","icons/icon-192.png","icons/icon-512.png","icons/icon-maskable-512.png","icons/apple-touch-icon.png"];
function row(state,title,detail){var d=document.createElement("div");d.className="r "+state;d.innerHTML='<span class="d">'+(state==="ok"?"✓":state==="bad"?"✕":"!")+'</span><div><b></b><small></small></div>';d.querySelector("b").textContent=title;d.querySelector("small").textContent=detail||"";out.appendChild(d);return d}
function get(u){return fetch(u,{cache:"no-store"}).then(function(r){return r})}
var ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
var inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|Snapchat|Telegram/i.test(ua);
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();prompt=e;btn.hidden=false;});
btn.addEventListener("click",function(){if(prompt){prompt.prompt();}});
(async function(){
  row(standalone?"ok":"warn","Running as an installed app?",standalone?"Yes, Campusly is already installed on this device.":"No, this is a normal browser tab.");
  var secure=window.isSecureContext&&(location.protocol==="https:"||location.hostname==="localhost");
  row(secure?"ok":"bad","Secure https address",secure?location.origin:"This page is on "+location.protocol+"//"+location.host+". Apps only install from https:// websites, not from file:// or a preview link. Deploy to Firebase Hosting or Vercel and open that link.");
  row(inApp?"bad":"ok","Real browser",inApp?"You are inside another app (WhatsApp, Instagram, etc). Open the link in Chrome (Android) or Safari (iPhone).":ua.slice(0,90));
  var man=null;
  try{var mr=await get("manifest.webmanifest");if(!mr.ok)throw new Error("HTTP "+mr.status);man=await mr.json();
    var need=[];["name","start_url","display"].forEach(function(k){if(!man[k])need.push(k)});
    var s192=(man.icons||[]).some(function(i){return /192x192/.test(i.sizes)}),s512=(man.icons||[]).some(function(i){return /512x512/.test(i.sizes)});
    if(!s192)need.push("192px icon");if(!s512)need.push("512px icon");if(man.display&&man.display!=="standalone")need.push("display should be standalone");
    row(need.length?"bad":"ok","Manifest file",need.length?"Problem: "+need.join(", "):"manifest.webmanifest loads and looks correct.");
  }catch(e){row("bad","Manifest file","manifest.webmanifest could not be loaded ("+e.message+"). Upload it to the same folder as the pages.");}
  var linked=!!document.querySelector('link[rel=manifest]');
  if(man){var bad=[];for(var i=0;i<(man.icons||[]).length;i++){var ic=man.icons[i];try{var r=await get(ic.src);if(!r.ok)bad.push(ic.src+" ("+r.status+")")}catch(e){bad.push(ic.src)}}
    row(bad.length?"bad":"ok","Icons",bad.length?"Missing: "+bad.join(", ")+". Upload the whole icons/ folder.":"All icons load.");}
  var miss=[];for(var j=0;j<SHELL.length;j++){try{var rr=await get(SHELL[j]);if(!rr.ok)miss.push(SHELL[j])}catch(e){miss.push(SHELL[j])}}
  row(miss.length?"bad":"ok","App files uploaded",miss.length?"Not found on this site: "+miss.join(", "):"All "+SHELL.length+" required files are there.");
  if(!("serviceWorker" in navigator)){row("bad","Service worker","This browser does not support service workers.");}
  else{try{var reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
      var st=reg.active?reg.active.state:"installing";row(reg.active?"ok":"warn","Service worker",reg.active?"Active ("+st+"). Offline support is on.":"Installed but not active yet. Reload this page once.");}
    catch(e){row("bad","Service worker","Could not start sw.js: "+e.message+". Check that sw.js is uploaded to the main folder.");}}
  var wait=row("warn","Browser install prompt","Waiting for the browser to say the app is installable…");
  setTimeout(function(){
    if(prompt){wait.className="r ok";wait.querySelector(".d").textContent="✓";wait.querySelector("b").textContent="Browser says: installable";wait.querySelector("small").textContent="Tap the Install button below.";}
    else if(standalone){wait.querySelector("small").textContent="Already installed, so no prompt is shown.";}
    else if(ios){wait.querySelector("small").textContent="iPhone never shows a prompt. In Safari tap Share, then Add to Home Screen.";}
    else{wait.className="r bad";wait.querySelector(".d").textContent="✕";wait.querySelector("b").textContent="No install prompt from the browser";wait.querySelector("small").textContent="Fix any red items above, then reload. In Chrome you can also try the ⋮ menu > Install app / Add to Home screen. If you already dismissed or installed it, clear the site's data in browser settings and retry.";}
  },2500);
})();
})();
</script></main></body></html>

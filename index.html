<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campusly</title>
<script>try{var t=localStorage.getItem("campusly-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F7FC">
<meta name="description" content="Campusly: attendance, schedule, tasks and CGPA for students, all in one place.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campusly"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --navy:#14264F;--blue:#356DFF;--deep:#214ED8;--purple:#7558E8;--ok:#16B89A;--err:#E5484D;--warn:#D9830C;
  --bg:#F4F7FC;--card:#FFFFFF;--text:#182542;--muted:#74819A;--border:#E1E8F5;
  --shadow:0 1px 2px rgba(20,38,79,.04),0 8px 24px rgba(20,38,79,.06);--hl:rgba(53,109,255,.07);--sil:rgba(53,109,255,.12);
  --att:linear-gradient(135deg,#1E45C8 0%,#356DFF 60%,#5F7BF2 100%);
}
:root[data-theme="dark"]{
  --bg:#0A1430;--card:#101F42;--text:#EAF0FF;--muted:#98A6C6;--border:#22365F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);--hl:rgba(110,155,255,.1);--sil:rgba(120,140,220,.16);--err:#FF6B70;--warn:#F5B04A;
  --att:linear-gradient(135deg,#142E8F 0%,#1F48C9 60%,#3558D8 100%);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#frames{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;visibility:hidden}
#frames iframe.on{visibility:visible}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar{flex:none;position:relative;z-index:5;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(20,38,79,.06)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;font-size:.72rem;color:var(--muted);border-radius:12px;text-align:center;text-decoration:none}
.tab .ic{width:24px;height:24px}
.tab:hover{background:var(--hl)}
.tab[aria-current="page"]{color:var(--blue);font-weight:600}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-6px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tab{text-decoration:none}
</style>
<script>
/* Returning users see the app at once; Firebase loads in the background after the page is ready. */
(function(){var d=document,ok=false;try{ok=localStorage.getItem("campusly-demo-session")==="1"}catch(e){}
if(!ok){var s=d.createElement("style");s.id="cs-guard";s.textContent="html{visibility:hidden}";d.head.appendChild(s);setTimeout(function(){var g=d.getElementById("cs-guard");if(g)g.remove()},4500)}
var loaded=false;window.__csLoadFb=function(){if(loaded)return;loaded=true;var m=d.createElement("script");m.type="module";m.src="campusly-firebase.js";d.head.appendChild(m)};
if(ok){window.addEventListener("load",function(){(window.requestIdleCallback||function(f){setTimeout(f,200)})(window.__csLoadFb,{timeout:1200})})}else{window.__csLoadFb()}})();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.500V21h5v-6h4v6h5V9.500"/></symbol><symbol id="i-att" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14h2M12 14h2M8 17h2"/></symbol><symbol id="i-task" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="3"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.500" fill="currentColor"/><circle cx="12" cy="12" r="1.500" fill="currentColor"/><circle cx="19" cy="12" r="1.500" fill="currentColor"/></symbol></defs></svg>
<main id="frames">
  <iframe id="f-home" title="Home" class="on"></iframe>
  <iframe id="f-attendance" title="Attendance" inert></iframe>
  <iframe id="f-schedule" title="Schedule" inert></iframe>
  <iframe id="f-tasks" title="Tasks and projects" inert></iframe>
  <iframe id="f-more" title="More" inert></iframe>
</main>
<nav class="tabbar" aria-label="Main navigation"><div class="tabs">
  <a class="tab" href="#home" data-tab="home" aria-current="page"><svg class="ic"><use href="#i-home"/></svg>Home</a>
  <a class="tab" href="#attendance" data-tab="attendance"><svg class="ic"><use href="#i-att"/></svg>Attendance</a>
  <a class="tab" href="#schedule" data-tab="schedule"><svg class="ic"><use href="#i-cal"/></svg>Schedule</a>
  <a class="tab" href="#tasks" data-tab="tasks"><svg class="ic"><use href="#i-task"/></svg>Tasks</a>
  <a class="tab" href="#more" data-tab="more"><svg class="ic"><use href="#i-more"/></svg>More</a>
</div></nav>
<noscript><p style="padding:24px">Campusly needs JavaScript to run.</p></noscript>
<script>
(function () {
  "use strict";
  var TABS = ["home", "attendance", "schedule", "tasks", "more"], FILE = {}, frames = {}, links = {}, loaded = {}, stale = {}, pending = {}, active = "home", timer = null;
  var SYNC = ["campusly-profile-demo", "campusly-cgpa-demo", "campusly-more-prefs", "campusly-attendance-demo", "campusly-attendance-summary", "campusly-schedule-demo", "campusly-tasks-demo", "campusly-activity"];
  TABS.forEach(function (t) {
    FILE[t] = t + ".html"; frames[t] = document.getElementById("f-" + t); links[t] = document.querySelector('.tab[data-tab="' + t + '"]');
    frames[t].addEventListener("load", function () {
      if (pending[t]) { try { frames[t].contentWindow.location.hash = "#" + pending[t]; } catch (e) {} delete pending[t]; }
      preloadNext();
    });
  });
  function load(t, sub) { loaded[t] = true; stale[t] = false; frames[t].src = FILE[t] + (sub ? "#" + sub : ""); }
  function reload(t) { try { frames[t].contentWindow.location.reload(); } catch (e) { frames[t].src = frames[t].src; } stale[t] = false; }
  function setHash(t, sub) { try { frames[t].contentWindow.location.hash = sub ? "#" + sub : ""; } catch (e) { pending[t] = sub; } }
  function show(t, sub, push) {
    if (TABS.indexOf(t) < 0) t = "home";
    if (!loaded[t]) load(t, sub);
    else { if (stale[t]) { if (sub) pending[t] = sub; reload(t); } else if (sub) setHash(t, sub); }
    active = t;
    TABS.forEach(function (x) {
      var on = x === t; frames[x].classList.toggle("on", on); if (on) frames[x].removeAttribute("inert"); else frames[x].setAttribute("inert", "");
      if (on) links[x].setAttribute("aria-current", "page"); else links[x].removeAttribute("aria-current");
    });
    if (push) { try { history.pushState({ t: t }, "", "#" + t); } catch (e) {} }
  }
  function parseHash() { var p = location.hash.slice(1).split(":"); return { t: p[0] || "home", sub: p.slice(1).join(":") }; }
  /* open the other tabs quietly in the background, one at a time, so every tap afterwards is instant */
  function preloadNext() {
    var next = TABS.filter(function (t) { return !loaded[t]; })[0]; if (!next) return;
    (window.requestIdleCallback || function (f) { setTimeout(f, 150); })(function () { if (!loaded[next]) load(next); }, { timeout: 800 });
  }
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var a = e.target.closest("a[data-tab]"); if (!a) return; e.preventDefault();
    var t = a.getAttribute("data-tab"); if (t === active) { try { frames[t].contentWindow.scrollTo({ top: 0, behavior: "smooth" }); } catch (x) {} return; }
    show(t, "", true);
  });
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || d.campusly !== "go") return;
    if (!TABS.some(function (t) { return frames[t].contentWindow === e.source; })) return;
    var m = String(d.url).match(/^(index|home|attendance|schedule|tasks|more)\.html(?:#(.*))?$/); if (!m) return;
    show(m[1] === "index" ? "home" : m[1], m[2] || "", true);
  });
  window.addEventListener("popstate", function () { var h = parseHash(); show(h.t, h.sub, false); });
  /* something was saved in one tab: refresh the other tabs in the background so they never show old numbers */
  window.addEventListener("storage", function (e) {
    if (e.key === "campusly-theme" && (e.newValue === "dark" || e.newValue === "light")) { document.documentElement.setAttribute("data-theme", e.newValue); return; }
    if (e.key && SYNC.indexOf(e.key) < 0) return;
    TABS.forEach(function (t) { if (t !== active && loaded[t]) stale[t] = true; });
    clearTimeout(timer); timer = setTimeout(function () { TABS.forEach(function (t, i) { if (stale[t] && t !== active) setTimeout(function () { if (stale[t] && t !== active) reload(t); }, i * 150); }); }, 700);
  });
  if (!document.documentElement.getAttribute("data-theme")) document.documentElement.setAttribute("data-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  window.CampuslyShell = { logout: function () {
    if (window.CampuslyAuth && window.CampuslyAuth.logout) return window.CampuslyAuth.logout();
    window.__csLogout = 1; if (window.__csLoadFb) window.__csLoadFb();
    setTimeout(function () { try { localStorage.removeItem("campusly-demo-session"); } catch (e) {} window.location.href = "auth.html"; }, 3000);
  } };
  var h = parseHash(); show(h.t, h.sub, false);
  try { history.replaceState({ t: active }, "", "#" + active); } catch (e) {}
})();
</script>
<script src="pwa.js" defer></script>
</body></html>

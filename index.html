:root{
  --navy:#2E1710;--blue:#E9694B;--deep:#D45A3C;--purple:#B5527E;--ok:#16B89A;--err:#E5484D;--warn:#D9830C;

  --att:linear-gradient(135deg,#4B2016 0%,#6B2E1F 60%,#7A3624 100%);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top);background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.tabbar{flex:none;position:relative;z-index:5;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(60,30,20,.06)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;font-size:.72rem;color:var(--muted);border-radius:12px;text-align:center;text-decoration:none}

.sumcard .txt{width:100%}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:6px 0}
.stats4 .stat{display:flex;flex-direction:column;align-items:center;background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:10px 2px;text-align:center}
.stats4 .stat+.stat{border-left:1px solid var(--border)!important}
.stats4 .stat b{order:1;font-size:1.3rem}.stats4 .stat span{order:2;font-size:.66rem}
.act4 button{flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:96px;gap:8px;border:0}
#addSubj{order:3;width:100%;margin-top:10px}
.sec-head:has(#addSubj){flex-wrap:wrap}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subj{padding:14px 12px}
.subj .head{flex-wrap:wrap;gap:8px}
.subj .head .nm{flex:1 1 100%;order:2}
.subj .head .pc{order:3;flex:1 1 100%;text-align:left;display:flex;align-items:center;justify-content:space-between}
.subj .head .pc strong{display:inline}
.reset{flex-direction:column;align-items:stretch;text-align:center}
dialog .dacts .btn,.dlg-actions .btn{flex:1}

/* --- SCHEDULE --- */
.today-card{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today-card>:not(.n){grid-row:1;grid-column:1/-1}
.today-card>.n{grid-row:2;text-align:left;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding:12px;border-radius:18px;border-left:0;box-shadow:inset 0 4px 0 var(--c)}
.ev .m{grid-area:1/1;min-width:0}
.ev .tm{grid-area:1/2;width:auto;text-align:right}
.ev .acts{grid-area:2/1/3/3;justify-content:flex-end;margin-top:4px}

/* --- TASKS --- */
.stats{display:flex!important;overflow-x:auto;gap:10px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats>*{flex:none;min-width:128px}
.filters{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .fld{flex:none;width:auto;min-width:130px;border-radius:999px}
.search .fld{border-radius:999px}
.fab{left:auto!important;right:16px!important}
@media(max-width:959px){.cols{display:flex!important;flex-direction:column;gap:16px}.cols>aside{order:2}}

/* --- MORE --- */
.menus{margin-top:14px;display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
.menus .menu{flex-direction:column;align-items:flex-start;gap:10px;min-height:112px;border-radius:22px}
.menus .menu>.ic,.menus .menu>svg:last-child{display:none}
.hp-home .grid4{border:1px solid rgba(255,255,255,.06)}
</style></head>

"/><\/svg><\/button><\/div>\n      <div class=\"rowb\"><b class=\"sel\" id=\"selLabel\"><\/b><button class=\"btn ghost sm\" type=\"button\" id=\"todayBtn\">Today<\/button><\/div>\n      <div class=\"today-card\" id=\"todayCard\"><\/div>\n      <section class=\"card pad\" aria-labelledby=\"dlH\"><div class=\"rowb\"><h2 id=\"dlH\">Daily Schedule<\/h2><button class=\"btn primary sm\" type=\"button\" data-add><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>Add<\/button><\/div><div id=\"dayList\"><\/div><\/section>\n    <\/div>\n    <div class=\"stack\">\n      <section class=\"card pad\" aria-labelledby=\"upH\"><h2 id=\"upH\">Upcoming Classes<\/h2><div id=\"upList\"><\/div><\/section>\n      <section class=\"card pad\" id=\"remCard\" aria-labelledby=\"rmH\"><h2 id=\"rmH\">Reminders<\/h2>\n        <p class=\"note\" id=\"remNote\"><\/p>\n        <div class=\"dacts\" style=\"justify-content:flex-start;flex-wrap:wrap\"><button class=\"btn primary sm\" type=\"button\" id=\"remBtn\"><\/button><button class=\"btn ghost sm\" type=\"button\" id=\"remTest\">Send test reminder<\/button><\/div>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"v-timetable\" hidden><div class=\"card pad\">\n  <div class=\"rowb\"><h2>Weekly Timetable<\/h2><button class=\"btn primary sm\" type=\"button\" id=\"addClass\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg>Add Class<\/button><\/div>\n  <div class=\"days\" id=\"tDays\" style=\"margin:14px 0 4px\"><\/div>\n  <div class=\"chips\" id=\"tChips\" role=\"group\" aria-label=\"Filter by type\"><\/div>\n  <label for=\"tSub\" style=\"margin-top:0\">Subject<\/label><select class=\"fld\" id=\"tSub\"><\/select>\n  <div id=\"tList\" style=\"margin-top:8px\"><\/div>\n  <p class=\"note\">Weekly classes repeat every week. One-time events appear in the Daily and Calendar views.<\/p>\n<\/div><\/section>\n\n<section id=\"v-calendar\" hidden><div class=\"ov\"><div class=\"card pad\">\n  <div class=\"rowb\"><button class=\"icon-btn\" type=\ er for every tab page except home --- */\n.hero-panel:not(.hp-home){display:grid;grid-template-columns:auto 1fr auto auto auto;column-gap:6px;row-gap:12px;align-items:center;padding-bottom:22px}\n.hero-panel:not(.hp-home) .hero,.hero-panel:not(.hp-home) .top{display:contents}\n.hero-panel:not(.hp-home) .sp{display:none}\n.hero-panel:not(.hp-home) .back{grid-area:1/1}\n.hero-panel:not(.hp-home) .titlebar{grid-area:1/2/2/5;margin:0;justify-content:center}\n.hero-panel:not(.hp-home) .titlebar h1{font-size:1.2rem;text-align:center}\n.hero-panel:not(.hp-home) .avatar{grid-area:1/5;margin:0}\n.hero-panel:not(.hp-home) .subt,.hero-panel:not(.hp-home) .sub-title{grid-area:2/1/3/4;margin:0;font-size:.86rem;line-height:1.35}\n.hero-panel:not(.hp-home) .theme{grid-area:2/4}\n.hero-panel:not(.hp-home) #bellBtn{grid-area:2/5}\n.hero-panel:not(.hp-home) .seg{grid-area:3/1/4/-1;margin:0;background:rgba(255,255,255,.12)}\n.hero-panel:not(.hp-home) .seg button{color:rgba(255,255,255,.75)}\n.hero-panel:not(.hp-home) .seg button[aria-pressed=\"true\"]{background:#fff;color:var(--deep)}\n.hero-panel .icon-btn.back{background:rgba(255,255,255,.14)}\n\n/* --- HOME --- */\n.hp-home{margin-bottom:46px;padding-bottom:0;gap:12px}\n.hp-home .hero{display:grid;grid-template-columns:auto 1fr auto auto auto;column-gap:6px;align-items:center}\n.hp-home .top{display:contents}\n.hp-home .top .avatar{grid-area:1/1;margin:0 10px 0 0;width:54px;height:54px;font-size:1.1rem}\n.hp-home .hello{grid-area:1/2;margin:0}\n.hp-home .hello p{font-size:.85rem;line-height:1.2}\n.hp-home .hello h1{font-size:1.35rem;margin:0}\n.hp-home .hello small{display:block;font-size:.7rem;line-height:1.25;margin-top:2px}\n.hp-home #menuBtn{grid-area:1/3;width:40px;height:40px;background:rgba(255,255,255,.12);color:#fff}\n.hp-home #themeToggle{grid-area:1/4;width:40px;height:40px}\n.hp-home #bellBtn{grid-area:1/5;width:40px;height:40px}\n.hp-home .sil{display:none}\n.hp-home .att-card{flex-direction:column;align-items:center; lass=\"ic\"><use href=\"#i-plus\"/><\/svg><\/span><span class=\"m\"><b>Install app<\/b><small>Add Campusly to your home screen<\/small><\/span><svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/button>\n        <button class=\"menu\" type=\"button\" id=\"logoutMenu\"><span class=\"tile t-red\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/span><span class=\"m\"><b>Log out<\/b><small>Sign out of this device<\/small><\/span><svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/button>\n      <\/nav>\n    <\/div><\/section>\n\n    <\!-- ===== PROFILE ===== -->\n    <section id=\"view-profile\" hidden aria-label=\"My profile\"><div class=\"card pad\" style=\"max-width:640px\" id=\"profileBody\"><\/div><\/section>\n\n    <\!-- ===== CGPA ===== -->\n    <section id=\"view-cgpa\" hidden aria-label=\"CGPA calculator\">\n      <div class=\"seg\" role=\"group\" aria-label=\"Calculator view\" style=\"max-width:480px\">\n        <button type=\"button\" data-tab=\"calc\" aria-pressed=\"true\">Calculator<\/button><button type=\"button\" data-tab=\"hist\" aria-pressed=\"false\">Semester History<\/button>\n      <\/div>\n      <div id=\"cgBody\"><\/div>\n    <\/section>\n\n    <\!-- ===== SETTINGS ===== -->\n    <section id=\"view-settings\" hidden aria-label=\"Appearance and settings\"><div class=\"two\">\n      <div class=\"stack\">\n        <div class=\"card pad\">\n          <h2>Appearance<\/h2><p class=\"muted\" style=\"margin:4px 0 12px\">Choose your preferred theme. It is saved and used by every Campusly page.<\/p>\n          <div class=\"seg\" id=\"themeSeg\" role=\"group\" aria-label=\"Theme\"><button type=\"button\" data-mode=\"light\" aria-pressed=\"false\">Light<\/button><button type=\"button\" data-mode=\"dark\" aria-pressed=\"false\">Dark<\/button><button type=\"button\" data-mode=\"auto\" aria-pressed=\"false\">Auto<\/button><\/div>\n          <div class=\"pvs\">\n            <div class=\"pvw\"><button class=\"pv pv-l\" type=\"button\" data-mode=\"light\" aria-label=\"Use light theme\"><i class=\"a\"><\/i><i class=\"b\"><\/i><i class=\"b\"><\/i><\/button>Light mode<\/div>\n            <div class=\"pvw\"><button class=\"pv pv-d\" type=\"button\" data-mode=\"dark\" aria-label=\"Use dark theme\"><i class=\"a\"><\/i><i class=\"b\"><\/i><i class=\"b\"><\/i><\/button>Dark mode<\/div>\n          <\/div>\n          <p class=\"muted\" style=\"margin-top:12px\" id=\"themeNote\"><\/p>\n        <\/div>\n        <div class=\"card pad\">\n          <h2>App Preferences<\/h2>\n          <label style=\"margin-bottom:8px\">Decimal places for SGPA and CGPA<\/label>\n          <div class=\"seg\" id=\"precSeg\" role=\"group\" aria-label=\"Decimal places\"><button type=\"button\" data-prec=\"1\" aria-pressed=\"false\">1<\/button><button type=\"button\" data-prec=\"2\" aria-pressed=\"false\">2<\/button><button type=\"button\" data-prec=\"3\" aria-pressed=\"false\">3<\/button><\/div>\n          <label class=\"sw\" for=\"calmSw\"><span>Reduce animations<small>Turns off motion and transitions on this page<\/small><\/span><input type=\"checkbox\" role=\"switch\" id=\"calmSw\"><\/label>\n        <\/div>\n      <\/div>\n      <div class=\"stack\">\n        <div class=\"card pad dz\">\n          <h2>Your Data<\/h2>\n          <p class=\"muted\" style=\"margin:6px 0 14px\">Delete everything you have added: profile details, attendance, schedule, tasks, CGPA and activity. This cannot be undone.<\/p>\n          <button class=\"btn outline-danger full\" type=\"button\" id=\"resetAll\"><svg class=\"ic\"><use href=\"#i-warn\"/><\/svg>Delete all my data<\/button>\n        <\/div>\n      <\/div>\n    <\/div><\/section>\n\n    <\!-- ===== ABOUT & HELP ===== -->\n    <section id=\"view-about\" hidden aria-label=\"About and help\"><div class=\"two\">\n      <div class=\"stack\">\n        <div class=\"card about\">\n          <div class=\"logo\"><svg class=\"ic\"><use href=\"#i-cap\"/><\/svg><\/div>\n          <h2>Campusly<\/h2><p style=\"margin-top:2px\">Your College Life in One Place<\/p>\n          <span class=\"pill\" style=\"margin-top:10px\">v1.0<\/span>\n          <p>Campusly is a college companion for managing classes, attendance, assignments, projects and academic progress, so you can stay organised and focused.<\/p>\n        <\/div>\n        <div class=\"note\" role=\"note\"><svg class=\"ic\"><use href=\"#i-info\"/><\/svg><span><b>Campusly<\/b> keeps your attendance, schedule, tasks and CGPA in your own account.<\/span><\/div>\n      <\/div>\n      <div class=\"card pad\" id=\"faqCard\">\n        <h2 style=\"margin-bottom:4px\">Frequently Asked Questions<\/h2>\n        <details><summary>How do I add a new assignment?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>Open the Tasks tab and tap Add. Choose Assignment or Project, fill in the details and save.<\/p><\/details>\n        <details><summary>How does the CGPA calculator work?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>Add each subject's credits and grade point for a semester. SGPA = Σ(credits × grade point) ÷ Σ credits. CGPA = Σ(semester credits × SGPA) ÷ Σ semester credits.<\/p><\/details>\n        <details><summary>Which grading scale should I use?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>Grading scales vary by university. Set your maximum grade point (for example 10, 5 or 4) in the CGPA Calculator and enter grade points exactly as your university awards them.<\/p><\/details>\n        <details><summary>Can I change the app theme?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>Yes. Use the sun/moon button at the top of any page, or choose Light, Dark or Auto in Appearance &amp; Settings.<\/p><\/details>\n        <details><summary>Is my data saved permanently?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>Yes. Your data is saved to your account and syncs when you are online. It stays on your device if you are offline and uploads later.<\/p><\/details>\n        <details><summary>How do I get help or support?<svg class=\"ic\"><use href=\"#i-chev\"/><\/svg><\/summary><p>A support channel will be added soon.<\/p><\/details>\n      <\/div>\n    <\/div><\/section>\n  <\/main>\n<\/div>\n\n<nav class=\"tabbar\" aria-label=\"Main navigation\"><div class=\"tabs\">\n  <a class=\"tab\" href=\"index.html\"><svg class=\"ic\"><use href=\"#i-home\"/><\/svg>Home<\/a>\n  <a class=\"tab\" href=\"attendance.html\"><svg class=\"ic\"><use href=\"#i-att\"/><\/svg>Attendance<\/a>\n  <a class=\"tab\" href=\"schedule.html\"><svg class=\"ic\"><use href=\"#i-cal\"/><\/svg>Schedule<\/a>\n  <a class=\"tab\" href=\"tasks.html\"><svg class=\"ic\"><use href=\"#i-task\"/><\/svg>Tasks<\/a>\n  <a class=\"tab\" href=\"more.html\" id=\"tabMore\" aria-current=\"page\"><svg class=\"ic\"><use href=\"#i-more\"/><\/svg>More<\/a>\n<\/div><\/nav>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<\!-- Add / edit subject -->\n<dialog id=\"subDlg\" aria-labelledby=\"subTitle\"><form id=\"subForm\" novalidate>\n  <div class=\"dh\"><h2 id=\"subTitle\">Add Subject<\/h2><button class=\"icon-btn\" type=\"button\" id=\"subClose\" aria-label=\"Close\"><svg class=\"ic\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n  <label for=\"sName\">Subject name *<\/label><input class=\"fld\" id=\"sName\" maxlength=\"60\" autocomplete=\"off\" placeholder=\"e.g. Computer Networks\"><div class=\"err\" id=\"eName\"><\/div>\n  <div class=\"g2\">\n    <div><label for=\"sCr\">Credits *<\/label><input class=\"fld\" id=\"sCr\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"e.g. 4\"><div class=\"err\" id=\"eCr\"><\/div><\/div>\n    <div><label for=\"sGp\">Grade point *<\/label><input class=\"fld\" id=\"sGp\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"e.g. 8 or 9\"><div class=\"err\" id=\"eGp\"><\/div><\/div>\n  <\/div>\n  <p class=\"muted\" id=\"gpHint\" style=\"margin-top:6px\"><\/p>\n  <label id=\"typeLbl\">Subject type<\/label>\n  <div class=\"radios\" role=\"radio a-label=\"Toggle light and dark theme\">\n  <svg class=\"sun\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\/svg>\n  <svg class=\"moon\" viewBox=\"0 0 24 24\"><path d=\"M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z\"/><\/svg>\n<\/button>\n\n<main>\n\n<\!-- ===================== SCREEN 1: SPLASH ===================== -->\n<section class=\"screen form-screen\" id=\"splashScreen\" aria-label=\"Welcome to Campusly\" hidden>\n  <div class=\"card splash-card\">\n    <h1 class=\"sr-only\">Welcome to Campusly<\/h1>\n    <div class=\"brand\">\n      <svg role=\"img\" aria-label=\"Campusly logo\" viewBox=\"0 0 64 64\"><use href=\"#logo\"/><\/svg>\n      <div class=\"wordmark\">Campusly<\/div><div class=\"tagline\">Your College Life in One Place<\/div>\n    <\/div>\n    <ul class=\"chips\"><li>Track Attendance<\/li><li>Manage Schedule<\/li><li>Achieve Goals<\/li><\/ul>\n    <button class=\"btn btn-primary\" type=\"button\" id=\"getStartedBtn\" data-goto=\"loginScreen\">Get Started <svg viewBox=\"0 0 24 24\"><use href=\"#i-arrow\"/><\/svg><\/button>\n  <\/div>\n<\/section>\n\n<\!-- ===================== SCREEN 2: LOGIN ===================== -->\n<section class=\"screen form-screen\" id=\"loginScreen\" aria-labelledby=\"loginTitle\" hidden>\n  <div class=\"card\">\n    <div class=\"brand\">\n      <svg role=\"img\" aria-label=\"Campusly logo\" viewBox=\"0 0 64 64\"><use href=\"#logo\"/><\/svg>\n      <div class=\"wordmark\">Campusly<\/div><div class=\"tagline\">Your College Life in One Place<\/div>\n    <\/div>\n    <h1 class=\"title\" id=\"loginTitle\">Welcome Back!<\/h1>\n    <p class=\"subtitle\">Login to continue your journey.<\/p>\n    <form id=\"loginForm\" novalidate>\n      <div class=\"field\">\n        <label for=\"loginId\">Roll Number / Email<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-user\"/><\/svg>\n          <input id=\"loginId\" type=\"text\" name=\"username\" autocomplete=\"username\" placeholder=\"Email\" aria-describedby=\"loginIdMsg\"><\/div>\n        <div class=\"msg error\" id=\"loginIdMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"loginPass\">Password<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-lock\"/><\/svg>\n          <input id=\"loginPass\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Enter your password\" aria-describedby=\"loginPassMsg\">\n          <button class=\"icon-btn\" type=\"button\" data-toggle=\"loginPass\" aria-label=\"Show password\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-eye\"/><\/svg><\/button><\/div>\n        <div class=\"msg error\" id=\"loginPassMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"row\">\n        <label class=\"check\"><input type=\"checkbox\" id=\"rememberMe\"> Remember me<\/label>\n        <button class=\"link\" type=\"button\" data-goto=\"forgotPasswordScreen\">Forgot Password?<\/button>\n      <\/div>\n      <button class=\"btn btn-primary\" type=\"submit\" id=\"loginBtn\">Login <svg viewBox=\"0 0 24 24\"><use href=\"#i-arrow\"/><\/svg><\/button>\n      <div class=\"status\" id=\"loginStatus\" role=\"status\"><\/div>\n    <\/form>\n    <div class=\"divider\">OR<\/div>\n    <button class=\"btn btn-outline\" type=\"button\" id=\"googleBtn\">\n      <svg viewBox=\"0 0 24 24\" style=\"stroke:none\"><path fill=\"#4285F4\" d=\"M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.300 3-7.300z\"/><path fill=\"#34A853\" d=\"M12 22c2.700 0 5-.9 6.600-2.500l-3.200-2.500c-.9.600-2 1-3.400 1-2.600 0-4.800-1.800-5.600-4.100H3.100v2.600A10 10 0 0 0 12 22z\"/><path fill=\"#FBBC05\" d=\"M6.400 14c-.2-.6-.3-1.300-.3-2s.1-1.400.3-2V7.400H3.100a10 10 0 0 0 0 9.200z\"/><path fill=\"#EA4335\" d=\"M12 5.900c1.500 0 2.800.5 3.800 1.500l2.800-2.800A10 10 0 0 0 3.100 7.400L6.400 10c.8-2.300 3-4.100 5.600-4.100z\"/><\/svg>\n      Continue with Google<\/button>\n    <div class=\"status\" id=\"googleStatus\" role=\"status\"><\/div>\n    <p class=\"switch-text\">Don't have an account? <button class=\"link\" type=\"button\" data-goto=\"registerScreen\">Register<\/button><\/p>\n  <\/div>\n<\/section>\n\n<\!-- ===================== SCREEN 3: REGISTER ===================== -->\n<section class=\"screen form-screen\" id=\"registerScreen\" aria-labelledby=\"regTitle\" hidden>\n  <button class=\"back-btn\" type=\"button\" data-goto=\"loginScreen\" aria-label=\"Back to login\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-back\"/><\/svg><\/button>\n  <div class=\"card\">\n    <div class=\"brand\">\n      <svg role=\"img\" aria-label=\"Campusly logo\" viewBox=\"0 0 64 64\"><use href=\"#logo\"/><\/svg>\n      <div class=\"wordmark\">Campusly<\/div><div class=\"tagline\">Your College Life in One Place<\/div>\n    <\/div>\n    <h1 class=\"title\" id=\"regTitle\">Create Your Account<\/h1>\n    <p class=\"subtitle\">Let's get started.<\/p>\n    <form id=\"registerForm\" novalidate>\n      <div class=\"field\">\n        <label for=\"regName\">Full Name<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-user\"/><\/svg>\n          <input id=\"regName\" type=\"text\" autocomplete=\"name\" placeholder=\"Your full name\" aria-describedby=\"regNameMsg\"><\/div>\n        <div class=\"msg error\" id=\"regNameMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"regRoll\">Roll Number / Enrollment Number<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-id\"/><\/svg>\n          <input id=\"regRoll\" type=\"text\" autocomplete=\"off\" placeholder=\"Roll / enrollment no.\" aria-describedby=\"regRollMsg\"><\/div>\n        <div class=\"msg error\" id=\"regRollMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"regEmail\">Email Address<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-mail\"/><\/svg>\n          <input id=\"regEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"you@college.edu\" aria-describedby=\"regEmailMsg\"><\/div>\n        <div class=\"msg error\" id=\"regEmailMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"regPass\">Password<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-lock\"/><\/svg>\n          <input id=\"regPass\" type=\"password\" autocomplete=\"new-password\" placeholder=\"Create a password\" aria-describedby=\"regPassMsg strengthLabel\">\n          <button class=\"icon-btn\" type=\"button\" data-toggle=\"regPass\" aria-label=\"Show password\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-eye\"/><\/svg><\/button><\/div>\n        <div class=\"strength\" id=\"strengthBar\" data-level=\"0\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n        <div class=\"strength-label\" id=\"strengthLabel\" aria-live=\"polite\">Use 8+ characters with upper, lower, number and symbol.<\/div>\n        <div class=\"msg error\" id=\"regPassMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label for=\"regConfirm\">Confirm Password<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-lock\"/><\/svg>\n          <input id=\"regConfirm\" type=\"password\" autocomplete=\"new-password\" placeholder=\"Re-enter your password\" aria-describedby=\"regConfirmMsg\">\n          <button class=\"icon-btn\" type=\"button\" data-toggle=\"regConfirm\" aria-label=\"Show password\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-eye\"/><\/svg><\/button><\/div>\n        <div class=\"msg error\" id=\"regConfirmMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <button class=\"btn btn-primary\" type=\"submit\" id=\"registerBtn\">Register <svg viewBox=\"0 0 24 24\"><use href=\"#i-arrow\"/><\/svg><\/button>\n      <div class=\"status\" id=\"registerStatus\" role=\"status\"><\/div>\n    <\/form>\n    <p class=\"switch-text\">Already have an account? <button class=\"link\" type=\"button\" data-goto=\"loginScreen\">Login<\/button><\/p>\n  <\/div>\n<\/section>\n\n<\!-- ===================== SCREEN 4: FORGOT PASSWORD ===================== -->\n<section class=\"screen form-screen\" id=\"forgotPasswordScreen\" aria-labelledby=\"forgotTitle\" hidden>\n  <button class=\"back-btn\" type=\"button\" data-goto=\"loginScreen\" aria-label=\"Back to login\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-back\"/><\/svg><\/button>\n  <div class=\"card\">\n    <div class=\"brand\">\n      <svg role=\"img\" aria-label=\"Campusly logo\" viewBox=\"0 0 64 64\"><use href=\"#logo\"/><\/svg>\n      <div class=\"wordmark\">Campusly<\/div><div class=\"tagline\">Your College Life in One Place<\/div>\n    <\/div>\n    <h1 class=\"title\" id=\"forgotTitle\">Forgot Password?<\/h1>\n    <p class=\"subtitle\">Enter your registered email address or roll number. Password recovery will be connected later.<\/p>\n    <form id=\"forgotForm\" novalidate>\n      <div class=\"field\">\n        <label for=\"forgotId\">Email / Roll Number<\/label>\n        <div class=\"control\"><svg viewBox=\"0 0 24 24\"><use href=\"#i-mail\"/><\/svg>\n          <input id=\"forgotId\" type=\"text\" autocomplete=\"username\" placeholder=\"Email\" aria-describedby=\"forgotIdMsg\"><\/div>\n        <div class=\"msg error\" id=\"forgotIdMsg\" role=\"alert\"><\/div>\n      <\/div>\n      <button class=\"btn btn-primary\" type=\"submit\" id=\"forgotBtn\">Send Reset Link<\/button>\n      <div class=\"status\" id=\"forgotStatus\" role=\"status\"><\/div>\n    <\/form>\n    <p class=\"switch-text\"><button class=\"link\" type=\"button\" data-goto=\"loginScreen\">Back to Login<\/button><\/p>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<script>\n(function () {\n  \"use strict\";\n\n  /* ===== SCREEN CONTROLLER ===== */\n  var SCREENS = [\"splashScreen\", \"loginScreen\", \"registerScreen\", \"forgotPasswordScreen\"];\n  var currentScreen = null;\n  var started = false;     // true once Get Started was clicked in this page load\n  var memLogged = false;   // fallback if browser storage is blocked\n  var SESSION_KEY = \"campusly-demo-session\";  // non-sensitive flag only, never passwords\n\n  // Demo \"logged in\" flag (no real authentication yet)\n  function isLoggedIn() {\n    try { return memLogged || localStorage.getItem(SESSION_KEY) === \"1\" || sessionStorage.getItem(SESSION_KEY) === \"1\"; }\n    catch (e) { return memLogged; }\n  }\n  function setLoggedIn(remember) {\n    memLogged = true;\n    try { (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, \"1\"); } catch (e) {}\n  }\n  function clearLogin() {\n    memLogged = false;\n    try { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}\n  }\n\n  // Show one screen, hide the rest. push=true adds a browser-history entry.\n  function showScreen(id, push) {\n    if (SCREENS.indexOf(id) === -1) id = \"splashScreen\";\n    // Gate: logged-in users never see the splash; others must press Get Started first\n    if (isLoggedIn() && id === \"splashScreen\") id = \"loginScreen\";\n    else if (!isLoggedIn() && !started && id !== \"splashScreen\") id = \"splashScreen\";\n    SCREENS.forEach(function (s) { document.getElementById(s).hidden = (s !== id); });\n    currentScreen = id;\n    window.scrollTo(0, 0);\n    if (push) { try { history.pushState({ screen: id }, \"\", \"#\" + id); } catch (e) {} }\n    // Move focus to the heading for keyboard / screen-reader users\n    var h = document.querySelector(\"#\" + id + \" h1\");\n    if (h) { h.setAttribute(\"tabindex\", \"-1\"); h.focus({ preventScroll: true }); }\n  }\n\n  // Browser back/forward\n  window.addEventListener(\"popstate\", function (e) {\n    var id = (e.state && e.state.screen) || location.hash.replace(\"#\", \"\") || \"splashScreen\";\n    showScreen(id, false);\n  });\n\n  // n setError(input, msgId, !v ? \"Please enter your email address.\" : EMAIL_RE.test(v) ? \"\" : \"Enter a valid email address, like name@college.edu.\"); }\n\n  /* ===== LOGIN ===== */\n  var loginId = document.getElementById(\"loginId\"), loginPass = document.getElementById(\"loginPass\");\n  document.getElementById(\"loginForm\").addEventListener(\"submit\", function (e) {\n    e.preventDefault(); hideStatus(\"loginStatus\");\n    var a = emailMsg(loginId, \"loginIdMsg\");\n    var b = setError(loginPass, \"loginPassMsg\", loginPass.value ? \"\" : \"Please enter your password.\");\n    if (!a || !b) return;\n    demoSubmit(document.getElementById(\"loginBtn\"), function () {\n      return fb().login(loginId.value.trim(), loginPass.value, document.getElementById(\"rememberMe\").checked).then(function () {\n        loginPass.value = \"\"; showStatus(\"loginStatus\", \"Signed in. Opening your dashboard…\"); try { window.parent.CampuslyShell.authed(); } catch (e) {}\n      }, function (err) { showStatus(\"loginStatus\", errText(err)); });\n    });\n  });\n  document.getElementById(\"googleBtn\").addEventListener(\"click\", function () {\n    hideStatus(\"googleStatus\");\n    fb().google().then(function () { showStatus(\"googleStatus\", \"Signed in. Opening your dashboard…\"); try { window.parent.CampuslyShell.authed(); } catch (e) {} },\n      function (err) { showStatus(\"googleStatus\", errText(err)); });\n  });\n  loginId.addEventListener(\"input\", function () { setError(loginId, \"loginIdMsg\", \"\"); });\n  loginPass.addEventListener(\"input\", function () { setError(loginPass, \"loginPassMsg\", \"\"); });\n\n  /* ===== REGISTER ===== */\n  var rName = document.getElementById(\"regName\"), rRoll = document.getElementById(\"regRoll\"),\n      rEmail = document.getElementById(\"regEmail\"), rPass = document.getElementById(\"regPass\"),\n      rConf = document.getElementById(\"regConfirm\");\n  var bar = document.getElementById(\"strengthBar\"), barLabel = document.getElementById(\"strengthLabel\");\n  var LEVELS = [\"Use 8+ characters with upper, lower, number and symbol.\", \"Weak password\", \"Fair password\", \"Good password\", \"Strong password\"];\n\n  // Simple local strength rules: length, upper+lower, number, symbol\n  function strengthOf(p) {\n    if (!p) return 0;\n    var s = 0;\n    if (p.length >= 8) s++;\n    if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;\n    if (/\\d/.test(p)) s++;\n    if (/[^A-Za-z0-9]/.test(p)) s++;\n    return Math.max(s, 1);\n  }\n  rPass.addEventListener(\"input\", function () {\n    var lvl = strengthOf(rPass.value);\n    bar.setAttribute(\"data-level\", lvl); barLabel.textContent = LEVELS[lvl];\n    setError(rPass, \"regPassMsg\", \"\");\n    if (rConf.value) setError(rConf, \"regConfirmMsg\", rConf.value === rPass.value ? \"\" : \"Passwords do not match.\");\n  });\n  [[rName, \"regNameMsg\"], [rRoll, \"regRollMsg\"], [rEmail, \"regEmailMsg\"], [rConf, \"regConfirmMsg\"]].forEach(function (p) {\n    p[0].addEventListener(\"input\", function () { setError(p[0], p[1], \"\"); });\n  });\n\n  document.getElementById(\"registerForm\").addEventListener(\"submit\", function (e) {\n    e.preventDefault(); hideStatus(\"registerStatus\");\n    var ok = [\n      setError(rName, \"regNameMsg\", rName.value.trim().length >= 2 ? \"\" : \"Please enter your full name.\"),\n      setError(rRoll, \"regRollMsg\", rRoll.value.trim() ? \"\" : \"Please enter your roll or enrollment number.\"),\n      setError(rEmail, \"regEmailMsg\", !rEmail.value.trim() ? \"Please enter your email address.\" : (EMAIL_RE.test(rEmail.value.trim()) ? \"\" : \"Enter a valid email address, like name@college.edu.\")),\n      setError(rPass, \"regPassMsg\", !rPass.value ? \"Please create a password.\" : (strengthOf(rPass.value) < 2 || rPass.value.length < 8 ? \"Use at least 8 characters with a mix of letters and numbers.\" : \"\")),\n      setError(rConf, \"regConfirmMsg\", !rConf.value ? \"Please confirm your password.\" : (rCon   }
  function parseHash() { var p = location.hash.slice(1).split(":"); return { t: p[0] || "home", sub: p.slice(1).join(":") }; }
  /* open the other tabs quietly in the background, one at a time, so every tap afterwards is instant */
